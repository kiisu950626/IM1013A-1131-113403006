<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Exercise 37 - Circle Functions</title>
</head>
<body>
    <h1>Circle Calculator</h1>

    <p>Enter the radius of a circle:</p>
    <input type="number" id="radius" placeholder="Enter radius">

    <button onclick="calculate()">Calculate</button>

    <p id="circumferenceResult"></p>
    <p id="areaResult"></p>

    <script>
        function calcCircumference(radius) {
            let circumference = 2 * Math.PI * radius;
            document.getElementById("circumferenceResult").innerHTML =
                "The circumference is " + circumference.toFixed(2);
        }

        function calcArea(radius) {
            let area = Math.PI * radius * radius;
            document.getElementById("areaResult").innerHTML =
                "The area is " + area.toFixed(2);
        }

        function calculate() {
            let radius = document.getElementById("radius").value;

            calcCircumference(radius);
            calcArea(radius);
        }
    </script>
</body>
</html>
