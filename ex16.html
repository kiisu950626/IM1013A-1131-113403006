<!DOCTYPE html>
<html>
<head>
<style>
.box1 {
  background-color: lightblue;
  border: 5px double red;
  padding: 10px;
}

.box2 {
  background-color: yellow;
  border: 3px solid blue;
  border-radius: 10px;
  padding: 10px;
}

.box3 {
  background-color: green;
  border: 5px dotted gray;
  padding: 10px;
}
</style>
</head>

<body>

<div class="box1">
  Hello World
</div>

<div class="box2">
  Hello World
</div>

<div class="box3">
  Hello World
</div>

</body>
</html>
