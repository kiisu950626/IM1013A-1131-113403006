<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Try This</title>

<style>
body {
  font-family: Arial;
  padding: 40px;
}

/* 外框 */
.box {
  width: 500px;
  border: 1px solid #ccc;
  margin: auto;
}

/* 上方區 */
.header {
  display: flex;
  justify-content: space-between;
  padding: 10px;
  background: #f6f6f6;
}

/* 按鈕 */
.try-btn {
  height: 22px;
  border-radius: 8px;
  border: 1px solid #2f2f2f;
  background: white;
  font-size: 13px;
  cursor: pointer;
}

/* 圖片 */
.image-area img {
  width: 100%;
}

/* 資訊 */
.info {
  display: none;
  padding: 10px;
  background: #ccffcc;
}
</style>
</head>

<body>

<div class="box">
  <div class="header">
    <span>預覽</span>
    <button id="btn" class="try-btn">查看資訊</button>
  </div>

  <div class="image-area">
    <!-- 用線上圖片避免路徑錯誤 -->
    <img src="https://picsum.photos/500/200">
  </div>

  <div id="info" class="info">
    修改日期：2017/10/12<br>
    檔案：JPG<br>
    大小：466KB
  </div>
</div>

<script>
const btn = document.getElementById("btn");
const info = document.getElementById("info");

btn.onclick = function () {
  if (info.style.display === "block") {
    info.style.display = "none";
    btn.innerText = "查看資訊";
  } else {
    info.style.display = "block";
    btn.innerText = "收起資訊";
  }
};
</script>

</body>
</html>
