<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Try This</title>

<style>
body {
  font-family: Roboto, Arial, sans-serif;
  background-color: white;
  padding: 40px;
}

.box {
  width: 620px;
  border: 1px solid #eeeeee;
  margin: auto;
}

.header {
  height: 35px;
  background-color: #f6f6f6;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 26px 0 20px;
  color: #707070;
  font-size: 13px;
}

.try-btn {
  height: 22px;
  padding: 0 12px;
  border-radius: 8px;
  border: 1px solid #2f2f2f;
  background-color: #ffffff;
  color: #2f2f2f;
  font-size: 13px;
  cursor: pointer;
}

.image-area {
  background-color: #ffe3bd;
  padding: 0 50px;
}

.image-area img {
  width: 100%;
  height: 180px;
  object-fit: cover;
  display: block;
}

.info {
  display: none;
  background-color: #72ff72;
  color: #707070;
  font-size: 13px;
  line-height: 1.6;
  padding: 10px 20px;
}
</style>
</head>

<body>

<div class="box">
  <div class="header">
    <span>預覽</span>
    <button id="infoBtn" class="try-btn" onclick="toggleInfo()">查看資訊</button>
  </div>

  <div class="image-area">
    <img src="https://picsum.photos/500/180" alt="preview image">
  </div>

  <div id="infoBox" class="info">
    <div>修改日期：2017/10/12</div>
    <div>檔案：JPG</div>
    <div>大小：466.97KB</div>
    <div>路徑：\\designcenter.qnap.com.tw\DesignCenter\PM\RD 圖庫\WEB\Sample</div>
  </div>
</div>

<script>
function toggleInfo() {
  const infoBox = document.getElementById("infoBox");
  const infoBtn = document.getElementById("infoBtn");

  if (infoBox.style.display === "block") {
    infoBox.style.display = "none";
    infoBtn.innerText = "查看資訊";
  } else {
    infoBox.style.display = "block";
    infoBtn.innerText = "收起資訊";
  }
}
</script>

</body>
</html>
