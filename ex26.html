<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Image Styling Practice</title>

<style>
body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    gap: 20px;
}

/* 三張圖容器 */
.container {
    display: flex;
    width: 80%;
}

/* 左右圖片 */
.img-box {
    width: 33%;
}

.img-box img {
    width: 100%;
    height: 300px;
    
    /* 關鍵：避免變形 */
    object-fit: cover;

    /* 左圖圓角 */
    border-radius: 18px;
}

/* 中間圓形 */
.circle {
    width: 150px;
    height: 150px;

    border-radius: 50%;
    overflow: hidden;

    margin: 0 20px;

    /* 讓它在中間 */
    display: flex;
    justify-content: center;
    align-items: center;
}

.circle img {
    width: 100%;
    height: 100%;

    /* 關鍵：避免變形 */
    object-fit: cover;
}
</style>

</head>

<body>

<div class="container">

    <!-- 左圖 -->
    <div class="img-box">
        <img src="https://picsum.photos/400/600?random=1">
    </div>

    <!-- 中間圓 -->
    <div class="circle">
        <img src="https://picsum.photos/300/300?random=2">
    </div>

    <!-- 右圖 -->
    <div class="img-box">
        <img src="https://picsum.photos/400/600?random=3">
    </div>

</div>

</body>
</html>
