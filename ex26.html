<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ex23</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    padding: 60px 40px;
}

/* 排版 */
.container {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 30px;
}

/* 左右圖片 */
.left-img,
.right-img {
    width: 33%;
    height: 300px;
    object-fit: cover;   /* no distortion */
}

/* 左圖圓角 */
.left-img {
    border-radius: 12px;
}

/* 中間圓形 */
.circle-img {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    object-fit: cover;   /* no distortion */
    flex-shrink: 0;
}
</style>

</head>

<body>

<div class="container">

    <!-- 左圖 -->
    <img class="left-img" src="https://picsum.photos/400/600?random=1">

    <!-- 中間圓 -->
    <img class="circle-img" src="https://picsum.photos/300/300?random=2">

    <!-- 右圖 -->
    <img class="right-img" src="https://picsum.photos/400/600?random=3">

</div>

</body>
</html>
