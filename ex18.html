<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Headings Page</title>
    <style>
        body {
            font-family: serif;
            padding: 20px;
            max-width: 600px;
        }

        /* Heading 1: Bold with an Overline */
        h1 {
            text-decoration: overline;
            font-size: 2.5em;
            margin-bottom: 30px;
        }

        /* Heading 2: Italic, within a yellow-bordered box */
        h2 {
            font-style: italic;
            border: 2px solid yellow;
            outline: 1px solid black; /* Creates the double-edge look */
            padding: 5px 10px;
            font-weight: normal;
            margin-bottom: 30px;
        }

        /* Heading 3: Right-aligned and Underlined */
        h3 {
            text-align: right;
            text-decoration: underline;
            font-size: 1.5em;
        }
    </style>
</head>
<body>

    <h1>This is heading 1</h1>

    <h2>This is heading 2</h2>

    <h3>This is heading 3</h3>

</body>
</html>
