<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Heading Exercise</title>
    <style>
        body {
            font-family: serif; /* 圖片中使用的是襯線體 *
            padding: 40px;
            background-color: white;
        }

        /* Heading 1: 文字上方黑線 + 粉紅色文字陰影 */
        h1 {
            display: inline-block; /* 讓上劃線只跟隨文字長度 */
            text-decoration: overline;
            text-decoration-thickness: 3px; /* 調整上方線條粗細 */
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 40px;
            /* 圖片中文字後方似乎有粉紅色的重疊感，使用 text-shadow 達成 */
            text-shadow: 2px 2px 0px pink, 3px 3px 0px rgba(255,192,203,0.5);
            color: black;
        }

        /* Heading 2: 斜體 + 黃色粗邊框 + 黑色細外框 (Outline) */
        h2 {
            font-style: italic;
            font-weight: bold;
            font-size: 32px;
            padding: 5px 10px;
            margin-bottom: 40px;
            border: 4px solid yellow; /* 黃色粗邊 */
            outline: 1px solid black; /* 外層的黑色細線 */
            display: block;
            width: 95%; /* 模擬圖片中的長度 */
        }

        /* Heading 3: 靠右對齊 + 底線 */
        h3 {
            text-align: right;
            text-decoration: underline;
            font-size: 24px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>This is heading 1</h1>

    <h2>This is heading 2</h2>

    <h3>This is heading 3</h3>

</body>
</html>
