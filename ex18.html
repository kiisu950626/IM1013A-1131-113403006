<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Web Page Assignment</title>
    <style>
        body {
            font-family: serif;
            padding: 40px;
        }

        /* 第一部分：Heading 1 */
        h1 {
            text-decoration: overline;
            text-decoration-thickness: 3px;
            font-size: 42px;
            text-shadow: 2px 2px 0px pink;
            margin-bottom: 40px;
            display: inline-block;
        }

        /* 第二部分：完全依照你提供的代碼，不做任何調整 */
        h2 {
            font-size: 50px;
            font-weight: bold;
            font-style: italic;
            background-color: white;
            border: 2px solid black;
            outline: thick outset yellow;
            
            /* 基礎排版設定 */
            margin-bottom: 40px;
            display: block;
            width: fit-content;
            padding: 5px 10px;
        }

        /* 第三部分：Heading 3 */
        h3 {
            text-align: right;
            text-decoration: underline;
            font-size: 24px;
        }
    </style>
</head>
<body>

    <h1>This is heading 1</h1>

    <h2>This is heading 2</h2>

    <h3>This is heading 3</h3>

</body>
</html>
