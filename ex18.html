<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Heading 2 Style</title>
    <style>
        /* 將樣式分段撰寫，方便管理 */
        .heading-box {
            /* 文字大小與粗細 */
            font-size: 50px;
            font-weight: bold;
            font-style: italic;
            
            /* 背景與內容間距 */
            background-color: white;
            padding: 10px 20px;
            display: inline-block; /* 讓框框隨文字長度調整 */
            
            /* 內層黑線：使用 border */
            border: 2px solid black;
            
            /* 外層黃框：使用 outline outset */
            /* outset 會產生一種凸起的立體感 */
            outline: thick outset yellow;
            
            /* 關鍵：將 outline 往外推，確保黑線在內，黃框在外 */
            outline-offset: 2px; 
            
            /* 讓整體更有排版感 */
            margin: 40px;
        }
    </style>
</head>
<body>

    <div class="heading-box">
        This is heading 2
    </div>

</body>
</html>
